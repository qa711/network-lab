# Extra rules for network-lab. gitleaks' default rules look for cloud/API
# tokens and find nothing here; these catch the lab-style secrets it holds.
title = "network-lab"

[extend]
useDefault = true

[[rules]]
id = "ansible-inline-password"
description = "Ansible password written into a play"
regex = '''(?i)ansible_(?:become_)?password\s*:\s*["']?([^\s"'{]{3,})'''
secretGroup = 1
keywords = ["ansible_"]

[[rules]]
id = "hardcoded-pass-variable"
description = "PASS / PASSWORD variable holding a literal value"
regex = '''(?i)\b(?:[A-Z_]*PASS|PASSWORD)\s*=\s*["'`]?([^\s"'`$<{]{3,})'''
secretGroup = 1
keywords = ["pass"]
[[rules.allowlists]]
regexTarget = "line"
regexes = ['''(?:os\.environ|lookup\(|<[A-Z-]+>)''']

[[rules]]
id = "shell-default-secret"
description = "Secret given as a shell default value"
regex = '''(?i)\$\{[A-Z_]*(?:SECRET|COMMUNITY|PASS|KEY)[A-Z_]*:-([^}/$][^}]{3,})\}'''
secretGroup = 1
keywords = [":-"]
[[rules.allowlists]]
regexTarget = "line"
regexes = ['''RADIUS_LOCAL_SECRET''']

[[rules]]
id = "cisco-credential"
description = "Cisco username/enable password or secret with a value"
regex = '''(?im)(?:username\s+\S+[^\n]*?\b(?:password|secret)|^\s*enable\s+(?:password|secret)|\b(?:password|secret)\s+[0-9]{1,2})\s+(?:[0-9]{1,2}\s+)?([^\s<`]{3,})'''
secretGroup = 1
keywords = ["password", "secret"]
[[rules.allowlists]]
regexTarget = "line"
regexes = ['''<[A-Z0-9+-]+>''']

[[rules]]
id = "aaa-or-ike-key"
description = "TACACS+/RADIUS/IKE key or secret with a value"
regex = '''(?im)^\s*(?:key|secret)\s*=?\s*(?:[0-9]\s+)?([^\s<]{4,})\s*$'''
secretGroup = 1
keywords = ["key", "secret"]

[[rules]]
id = "test-aaa-password"
description = "Password typed into a test aaa command"
regex = '''(?i)test aaa group\s+\S+\s+\S+\s+([^\s<]{3,})\s+(?:legacy|new-code)'''
secretGroup = 1
keywords = ["test aaa"]

[[rules]]
id = "shared-secret-in-docs"
description = "Shared secret written out in docs"
regex = '''(?i)shared secret[^`\n]{0,25}`([^`<]{4,})`'''
secretGroup = 1
keywords = ["shared secret"]

[[rules]]
id = "snmp-community-written-out"
description = "SNMP community written out"
regex = '''(?i)community\s+`([A-Za-z0-9_\-]{4,})`'''
secretGroup = 1
keywords = ["community"]

[[rules]]
id = "snmpv3-localized-key"
description = "SNMPv3 localized key (as good as the password)"
regex = '''(?i)\b(?:auth|priv)\s+(?:md5|sha\S*|aes\S*|des)?\s*(0x[0-9a-f]{16,})'''
secretGroup = 1
keywords = ["0x"]

[[rules]]
id = "crypt-hash"
description = "Crypt-style password hash"
regex = '''\$(?:1|5|6|8|9|14)\$[A-Za-z0-9./]{2,}\$[A-Za-z0-9./]{8,}'''
keywords = ["$"]

[[rules]]
id = "home-ip-comment"
description = "IP address commented as home/WAN"
regex = '''((?:\d{1,3}\.){3}\d{1,3})[^\n]*#[^\n]*(?i:home|wan|local id)'''
secretGroup = 1
keywords = ["#"]
[[rules.allowlists]]
regexTarget = "line"
regexes = ['''203\.0\.113\.|<[A-Z-]+>''']

# The runbooks write REMOVED where a secret was taken out. Don't report the placeholder itself.
[[allowlists]]
description = "REMOVED placeholder in the runbooks"
regexTarget = "secret"
regexes = ['''(?:^|:)REMOVED$''']
