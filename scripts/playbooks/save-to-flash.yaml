- name: SavetoFlash
  hosts: "{{ target }}"
  gather_facts: false
  connection: ansible.netcommon.network_cli
  vars:
    ansible_network_os: cisco.ios.ios
    ansible_user: "{{ lookup('env', 'LAB_USER') }}"
    ansible_password: "{{ lookup('env', 'LAB_PASS') }}"
    ansible_become: true
    ansible_become_method: enable
    mgmt_if: Ethernet0/0

  tasks:

    - name: Global Config Settings
      cisco.ios.ios_config:
        lines:
          - command: copy running-config unix:phase1-good.cfg
            prompt:
              - 'Destination filename'
              - 'over ?write'
            answer:
              - "\r"
              - "\r"
      register: print_output
    - name: Save running to startup
      cisco.ios.ios_config:
        save_when: always
