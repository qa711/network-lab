---
- name: XE Base Config
  hosts: Q:!q-edge
  gather_facts: false
  connection: ansible.netcommon.network_cli
  vars:
    ansible_network_os: cisco.ios.ios
    ansible_user: "{{ lookup('env', 'LAB_USER') }}"
    ansible_password: "{{ lookup('env', 'LAB_PASS') }}"
    ansible_become: true
    ansible_become_method: enable

  tasks:
    - name: Merge provided configuration with device configuration
      cisco.ios.ios_interfaces:
        config:
          - name: Ethernet0/0
            description: TRUNK-LINK
            enabled: true
          - name: Ethernet0/1
            description: TRUNK-LINK
            enabled: true
          - name: Ethernet0/2
            description: TRUNK-LINK
            enabled: true
          - name: Ethernet0/3
            description: TRUNK-LINK
            enabled: true
        state: merged
      register: print_output
    - name: Save running to startup
      cisco.ios.ios_config:
        save_when: modified

- name: XE Base Config
  hosts: XE
  gather_facts: false
  connection: ansible.netcommon.network_cli
  vars:
    ansible_network_os: cisco.ios.ios
    ansible_user: "{{ lookup('env', 'LAB_USER') }}"
    ansible_password: "{{ lookup('env', 'LAB_PASS') }}"
    ansible_become: true
    ansible_become_method: enable

  tasks:
    - name: Global Config Settings
      cisco.ios.ios_config:
        lines:
          - service password-encryption
          - no ip http server
          - ip http secure-server
      register: print_output
    - name: Save running to startup
      cisco.ios.ios_config:
        save_when: modified

